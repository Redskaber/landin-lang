# Landin Compiler — CI Pipeline
#
# Runs on every push to main and every PR.
# Jobs: fmt → clippy → test → conformance → build-release
#
# Stage 30.11: Updated to use LLVM 22 (llvm-sys 221) via scripts/setup-llvm-env.sh
# Per §29.4 (Performance Testing Standard): performance job runs on release builds only.
# Per §3.2: all jobs must pass for merge (硬性红线).

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ──────────────────────────────────────────────────────
  # Job 1: Format check (fast — runs first as gate)
  # ──────────────────────────────────────────────────────
  fmt:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  # ──────────────────────────────────────────────────────
  # Job 2: Clippy lint (parallel with fmt)
  # ──────────────────────────────────────────────────────
  clippy:
    name: Clippy Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Setup LLVM 22 + Rust environment
        run: source scripts/env.sh
      - name: Run clippy
        run: cargo clippy --all-targets --features llvm-backend -- -D warnings

  # ──────────────────────────────────────────────────────
  # Job 3: Rust unit/integration tests
  # ──────────────────────────────────────────────────────
  test:
    name: Rust Tests
    needs: [fmt, clippy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Setup LLVM 22 + Rust environment
        run: source scripts/env.sh
      - name: Run tests
        run: |
          ulimit -s unlimited
          cargo test --features llvm-backend

  # ──────────────────────────────────────────────────────
  # Job 4: Conformance tests (.lin test suite)
  # ──────────────────────────────────────────────────────
  conformance:
    name: Conformance Tests
    needs: [fmt, clippy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Setup LLVM 22 + Rust environment
        run: source scripts/env.sh
      - name: Build release
        run: cargo build --release --features llvm-backend
      - name: Run conformance tests
        run: python3 tests/conformance/run_all.py

  # ──────────────────────────────────────────────────────
  # Job 5: Release build verification
  # ──────────────────────────────────────────────────────
  build-release:
    name: Release Build
    needs: [test, conformance]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Setup LLVM 22 + Rust environment
        run: source scripts/env.sh
      - name: Build release
        run: cargo build --release --features llvm-backend
      - name: Verify binary exists
        run: test -f target/release/landin-stage0
      - name: Smoke test — hello world
        run: |
          echo 'fn main() { println!("hello world!"); }' > /tmp/smoke.lin
          ./target/release/landin-stage0 --run /tmp/smoke.lin
