# Landin Compiler — CI Pipeline
#
# Runs on every push to main and every PR.
# Jobs: fmt → clippy → test → conformance → build-release
#
# Per §29.4 (Performance Testing Standard): performance job runs on release builds only.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ──────────────────────────────────────────────────────
  # Job 1: Format check (fast — runs first as gate)
  # ──────────────────────────────────────────────────────
  fmt:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  # ──────────────────────────────────────────────────────
  # Job 2: Clippy lint (parallel with fmt)
  # ──────────────────────────────────────────────────────
  clippy:
    name: Clippy Lint
    runs-on: ubuntu-latest
    env:
      LLVM_SYS_191_PREFIX: /usr/lib/llvm-19
      LLVM_LINK_SHARED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install LLVM 19
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add -
          echo "deb http://apt.llvm.org/jammy/ llvm-toolchain-jammy-19 main" | sudo tee /etc/apt/sources.list.d/llvm19.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq llvm-19-dev libpolly-19-dev libz3-dev
      - name: Run clippy
        run: cargo clippy --all-targets --features llvm-backend -- -D warnings

  # ──────────────────────────────────────────────────────
  # Job 3: Rust unit/integration tests
  # ──────────────────────────────────────────────────────
  test:
    name: Rust Tests
    needs: [fmt, clippy]
    runs-on: ubuntu-latest
    env:
      LLVM_SYS_191_PREFIX: /usr/lib/llvm-19
      LLVM_LINK_SHARED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install LLVM 19
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add -
          echo "deb http://apt.llvm.org/jammy/ llvm-toolchain-jammy-19 main" | sudo tee /etc/apt/sources.list.d/llvm19.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq llvm-19-dev libpolly-19-dev libz3-dev
      - name: Run tests
        run: cargo test --features llvm-backend

  # ──────────────────────────────────────────────────────
  # Job 4: Conformance tests (.lin test suite)
  # ──────────────────────────────────────────────────────
  conformance:
    name: Conformance Tests
    needs: [fmt, clippy]
    runs-on: ubuntu-latest
    env:
      LLVM_SYS_191_PREFIX: /usr/lib/llvm-19
      LLVM_LINK_SHARED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install LLVM 19
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add -
          echo "deb http://apt.llvm.org/jammy/ llvm-toolchain-jammy-19 main" | sudo tee /etc/apt/sources.list.d/llvm19.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq llvm-19-dev libpolly-19-dev libz3-dev
      - name: Build release
        run: cargo build --release --features llvm-backend
      - name: Run conformance tests
        run: python3 tests/conformance/run_all.py

  # ──────────────────────────────────────────────────────
  # Job 5: Release build verification
  # ──────────────────────────────────────────────────────
  build-release:
    name: Release Build
    needs: [test, conformance]
    runs-on: ubuntu-latest
    env:
      LLVM_SYS_191_PREFIX: /usr/lib/llvm-19
      LLVM_LINK_SHARED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install LLVM 19
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add -
          echo "deb http://apt.llvm.org/jammy/ llvm-toolchain-jammy-19 main" | sudo tee /etc/apt/sources.list.d/llvm19.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq llvm-19-dev libpolly-19-dev libz3-dev
      - name: Build release
        run: cargo build --release --features llvm-backend
      - name: Verify binary exists
        run: test -f target/release/landin-stage0
      - name: Smoke test — hello world
        run: |
          echo 'fn main() { println!("hello world"); }' > /tmp/smoke.lin
          ./target/release/landin-stage0 --run /tmp/smoke.lin
