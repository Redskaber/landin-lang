# Landin Compiler — Nightly Performance Tracking
#
# Runs nightly to track performance trends over time.
# Per §29.4 (Performance Testing Standard): establishes and maintains performance baselines.
#
# Results are committed to docs/develop/v0/performance-baselines/ for trend analysis.

name: Nightly Performance

on:
  schedule:
    # Run at 02:00 UTC every day
    - cron: "0 2 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  perf:
    name: Performance Benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install LLVM 19
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add -
          echo "deb http://apt.llvm.org/jammy/ llvm-toolchain-jammy-19 main" | sudo tee /etc/apt/sources.list.d/llvm19.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq llvm-19-dev libpolly-19-dev libz3-dev python3
      - name: Build release
        env:
          LLVM_SYS_191_PREFIX: /usr/lib/llvm-19
          LLVM_LINK_SHARED: "1"
        run: cargo build --release --features llvm-backend

      - name: Benchmark — Compile time (small program)
        env:
          LLVM_SYS_191_PREFIX: /usr/lib/llvm-19
          LLVM_LINK_SHARED: "1"
        run: |
          echo 'fn main() { println!("hello"); }' > /tmp/bench_small.lin
          START=$(date +%s%N)
          ./target/release/landin-stage0 --compile /tmp/bench_small.lin
          END=$(date +%s%N)
          echo "COMPILE_SMALL_MS=$(( (END - START) / 1000000 ))" >> $GITHUB_ENV

      - name: Benchmark — Compile time (fib(30))
        env:
          LLVM_SYS_191_PREFIX: /usr/lib/llvm-19
          LLVM_LINK_SHARED: "1"
        run: |
          echo 'fn fib(n: i32) -> i32 { if n < 2 { return n; } return fib(n-1) + fib(n-2); } fn main() { let r = fib(30); println!("{}", r); }' > /tmp/bench_fib.lin
          START=$(date +%s%N)
          ./target/release/landin-stage0 --compile /tmp/bench_fib.lin
          END=$(date +%s%N)
          echo "COMPILE_FIB_MS=$(( (END - START) / 1000000 ))" >> $GITHUB_ENV

      - name: Benchmark — Compile + run (fib(30))
        env:
          LLVM_SYS_191_PREFIX: /usr/lib/llvm-19
          LLVM_LINK_SHARED: "1"
        run: |
          START=$(date +%s%N)
          ./target/release/landin-stage0 --run /tmp/bench_fib.lin
          END=$(date +%s%N)
          echo "RUN_FIB_MS=$(( (END - START) / 1000000 ))" >> $GITHUB_ENV

      - name: Benchmark — Compile + run (100×100 loops)
        env:
          LLVM_SYS_191_PREFIX: /usr/lib/llvm-19
          LLVM_LINK_SHARED: "1"
        run: |
          echo 'struct P { x: i32, y: i32 } impl P { fn n(x: i32, y: i32) -> P { P { x, y } } fn d(&self, o: &P) -> i32 { let dx = self.x - o.x; let dy = self.y - o.y; dx*dx + dy*dy } } fn main() { let mut s = 0; for i in 0..100 { for j in 0..100 { let p1 = P::n(i,j); let p2 = P::n(i+1,j+1); s += p1.d(&p2); } } println!("{}", s); }' > /tmp/bench_loops.lin
          START=$(date +%s%N)
          ./target/release/landin-stage0 --run /tmp/bench_loops.lin
          END=$(date +%s%N)
          echo "RUN_LOOPS_MS=$(( (END - START) / 1000000 ))" >> $GITHUB_ENV

      - name: Benchmark — Conformance suite total time
        run: |
          START=$(date +%s%N)
          python3 tests/conformance/run_all.py > /dev/null 2>&1
          END=$(date +%s%N)
          echo "CONFORMANCE_MS=$(( (END - START) / 1000000 ))" >> $GITHUB_ENV

      - name: Output performance summary
        run: |
          echo "## Nightly Performance Baseline — $(date -u +%Y-%m-%d)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Benchmark | Time (ms) |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|----------|" >> $GITHUB_STEP_SUMMARY
          echo "| Compile small | ${{ env.COMPILE_SMALL_MS }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Compile fib(30) | ${{ env.COMPILE_FIB_MS }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Run fib(30) | ${{ env.RUN_FIB_MS }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Run 100×100 loops | ${{ env.RUN_LOOPS_MS }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Conformance suite | ${{ env.CONFORMANCE_MS }} |" >> $GITHUB_STEP_SUMMARY
