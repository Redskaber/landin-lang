[package]
name = "landin-compiler"
version = "0.11.41"
edition = "2021"
license = "MIT"
description = "Landin programming language compiler — Stage 0-4 complete + Stage 5.1-5.45 (TraitResolver + driver integration + Copy detection + DefId→name + vtable + vtable codegen + dyn Trait fat-pointer + stdlib MVP + builtin Copy/Clone/Drop + primitive Copy auto-detect + Copy unification + trait impl statistics + trait method query API + trait hierarchy/supertraits + TraitResolver summary + vtable method resolution + trait coherence checking + trait impl completeness check + trait impl validation report + driver validation integration + traits/mod.rs split + mini-cargo MVP + stdlib layout + stdlib trait method signatures + stdlib vtable slot layout + stdlib vtable byte size + stdlib vtable construction planner + stdlib vtable symbol name planner + stdlib vtable emission plan + stdlib vtable emission summary + codegen vtable emission helper + codegen vtable global text bridge + codegen vtable emission batch helper) + standardized tests/ directory"
repository = "https://github.com/landin-lang/main"
authors = ["redskaber"]
keywords = ["compiler", "language", "systems-programming"]
categories = ["compilers"]
# Stage 5.5 refactor: disable auto-discovery so only the unified
# `all_tests` target is built. Individual test files live under
# tests/v0/stage{N}/plan/ and are included via #[path] in all_tests.rs.
autotests = false

[[bin]]
name = "landin-stage0"
path = "src/bin/main.rs"

[lib]
name = "landin_compiler"
path = "src/lib.rs"

# Unified test entry point — includes all tests/v0/stage{N}/plan/*.rs
# files via #[path] mod declarations. See tests/all_tests.rs.
[[test]]
name = "all_tests"
path = "tests/all_tests.rs"

# Stage 4.11: Performance benchmark suite
[[bench]]
name = "compile_bench"
path = "benches/compile_bench.rs"

[dependencies]
lasso = "0.7"
unicode-xid = "0.2"
clap = { version = "4", features = ["derive"] }
