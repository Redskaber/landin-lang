[package]
name = "landin-compiler"
version = "0.3.2"
edition = "2021"
license = "MIT"
description = "Landin programming language compiler (stage 1 — HIR lowering complete, name resolution next)"
repository = "https://github.com/landin-lang/main"
keywords = ["compiler", "language", "systems-programming"]
categories = ["compilers"]

[[bin]]
name = "landin-stage0"
path = "src/bin/main.rs"

[lib]
name = "landin_compiler"
path = "src/lib.rs"

[dependencies]
lasso = "0.7"
unicode-xid = "0.2"
clap = { version = "4", features = ["derive"] }
