lit per §14.4 + Stage 6.14 borrowck/mod.rs architectural split per §14.4 + Stage 6.15 typeck/checker.rs architectural split per §14.4 + Stage 6.16 resolve/resolver.rs architectural split per §14.4 + Stage 6.17 reverted (insufficient ROI) + Stage 6.18 §25.8 full design-writeback + Stage 6 architectural refactoring concluded + Stage 7.1 region inference data structures per §13.4 + §14.4 + Stage 7.2 region inference algorithm per §4.2 + Stage 7.3 implied bounds + type tests per §4.6.2 + §4.6.4 + Stage 7.4 universe tracking + SCC compression per §4.6.3 + §4.6.5 + Stage 7.5 integrate into borrowck — TD-015 complete + Stage 7.6 user-defined trait dyn support — TD-018 + Stage 7.7 §25.8 design writeback for TD-015/TD-018 + Stage 7.8 §25 deep review GO) + standardized tests/ directory + Stage 13.3a TD-030 closure call lowering (inline approach)"
repository = "https://github.com/redskaber/landin-lang"
authors = ["redskaber"]
keywords = ["compiler", "language", "systems-programming"]
categories = ["compilers"]
# Stage 5.5 refactor: disable auto-discovery so only the unified
# `all_tests` target is built. Individual test files live under
# tests/v0/stage{N}/plan/ and are included via #[path] in all_tests.rs.
autotests = false

[[bin]]
name = "landin-stage0"
path = "src/bin/main.rs"

[lib]
name = "landin_compiler"
path = "src/lib.rs"

# Unified test entry point — includes all tests/v0/stage{N}/plan/*.rs
# files via #[path] mod declarations. See tests/all_tests.rs.
[[test]]
name = "all_tests"
path = "tests/all_tests.rs"

# Stage 4.11: Performance benchmark suite
[[bench]]
name = "compile_benchmark"
path = "benchmark/compile_bench.rs"

# Stage 14.5 §17.4: examples/usage/ — maintained API demos. Each MUST
# compile with the current public API; breakage must be fixed in the same
# round (per §17.4.2 rule 3). audit/ scripts are archived and not declared
# here (per §17.4.2 rule 4).
[[example]]
name = "struct_call_codegen"
path = "examples/usage/struct_call_codegen.rs"

[[example]]
name = "struct_compile_check"
path = "examples/usage/struct_compile_check.rs"

[[example]]
name = "struct_variants_codegen"
path = "examples/usage/struct_variants_codegen.rs"

[[example]]
name = "trait_dispatch_emission"
path = "examples/usage/trait_dispatch_emission.rs"
required-features = ["llvm-backend"]

[dependencies]
lasso = "0.7"
unicode-xid = "0.2"
clap = { version = "4", features = ["derive"] }

# Stage 13.5 MUV-1: LLVM library integration (GAP-1 closure)
# Supports LLVM 19 (build server) and LLVM 21 (user environment)
# Set LLVM_SYS_191_PREFIX or LLVM_SYS_211_PREFIX + LLVM_LINK_SHARED=1
[dependencies.llvm-sys]
version = "191.1.0"
features = ["prefer-dynamic"]
optional = true

[features]
# LLVM backend is NOT a default feature — it requires LLVM to be installed
# on the build machine and the resulting binary needs libLLVM.so at runtime.
#
# Build with LLVM support:
#   source scripts/setup-llvm-env.sh
#   cargo build --features llvm-backend
#   cargo test --features llvm-backend
#
# Build without LLVM (frontend-only, no --run/--emit-obj/--emit-bin):
#   cargo build
#   cargo test
default = []
llvm-backend = ["llvm-sys"]
