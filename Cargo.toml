[package]
name = "landin-compiler"
version = "0.8.13"
edition = "2021"
license = "MIT"
description = "Landin programming language compiler — Stage 0-3 complete (lexer, parser, HIR, MIR, typeck, borrowck, LLVM codegen) + Stage 3.63-3.68 cross-stage naming standardization + Process v3.16 (§25 deep review protocol) + Stage 0-3 deep review (GO-WITH-CONDITIONS for Stage 4)"
repository = "https://github.com/landin-lang/main"
authors = ["redskaber"]
keywords = ["compiler", "language", "systems-programming"]
categories = ["compilers"]

[[bin]]
name = "landin-stage0"
path = "src/bin/main.rs"

[lib]
name = "landin_compiler"
path = "src/lib.rs"

[dependencies]
lasso = "0.7"
unicode-xid = "0.2"
clap = { version = "4", features = ["derive"] }
