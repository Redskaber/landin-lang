[package]
name = "landin-compiler"
version = "0.11.80"
edition = "2021"
license = "MIT"
description = "Landin programming language compiler — Stage 0-4 complete + Stage 5.1-5.66 (TraitResolver + driver integration + Copy detection + DefId→name + vtable + vtable codegen + dyn Trait fat-pointer + stdlib MVP + builtin Copy/Clone/Drop + primitive Copy auto-detect + Copy unification + trait impl statistics + trait method query API + trait hierarchy/supertraits + TraitResolver summary + vtable method resolution + trait coherence checking + trait impl completeness check + trait impl validation report + driver validation integration + traits/mod.rs split + mini-cargo MVP + stdlib layout + stdlib trait method signatures + stdlib vtable slot layout + stdlib vtable byte size + stdlib vtable construction planner + stdlib vtable symbol name planner + stdlib vtable emission plan + stdlib vtable emission summary + codegen vtable emission helper + codegen vtable global text bridge + codegen vtable emission batch helper + codegen vtable spec builder + codegen vtable emission orchestrator + codegen dynptr global text helper + codegen dynptr spec builder + codegen dynptr emission orchestrator + codegen vtable+dynptr combined emission orchestrator + codegen trait-dispatch emission summary + codegen trait-dispatch emission plan + codegen trait-dispatch emission orchestrator plan-based + codegen trait-dispatch emission text batch + codegen trait-dispatch emission text batch from resolver + TextEmitter emit_vtable_global delegation + TextEmitter emit_dyn_trait_const delegation + emit_vtables delegation + emit_dyn_trait_ptrs delegation + DynTraitFatPtr MIR representation + build_dyn_trait_fat_ptrs_from_resolver + emit_dyn_trait_fat_ptr_text + emit_dyn_trait_fat_ptrs_text_batch + emit_dyn_trait_fat_ptrs_text_batch_from_resolver + DynTraitMethodCall MIR representation + emit_dyn_trait_method_call_text + build_dyn_trait_method_calls_from_fat_ptrs + emit_dyn_trait_method_calls_text_batch + emit_dyn_trait_method_calls_text_batch_from_resolver + DynTraitMIRSummary + build_dyn_trait_mir_summary_from_resolver + DynTraitMIRPlan + build_dyn_trait_mir_plan_from_resolver + emit_dyn_trait_mir_plan_text + find_dyn_trait_method_call_in_plan + MirLowerCtxt dyn_trait_plan field + setter/getter + find_dyn_trait_method_call_in_plan_by_method + MirBody dyn_trait_calls side-table + build_dyn_trait_call_terminator + HirExprKind::MethodCall dyn Trait integration + emit_dyn_trait_method_call + codegen_dyn_trait_call + Terminator::Call dyn Trait marker dispatch + lower_hir_body_to_mir_full_with_dyn_trait_plan + driver auto-build DynTraitMIRPlan + Deep Review #5 GO + TD-016 return_kind refinement + dyn Trait e2e integration tests + TD param_kinds refinement) + standardized tests/ directory"
repository = "https://github.com/landin-lang/main"
authors = ["redskaber"]
keywords = ["compiler", "language", "systems-programming"]
categories = ["compilers"]
# Stage 5.5 refactor: disable auto-discovery so only the unified
# `all_tests` target is built. Individual test files live under
# tests/v0/stage{N}/plan/ and are included via #[path] in all_tests.rs.
autotests = false

[[bin]]
name = "landin-stage0"
path = "src/bin/main.rs"

[lib]
name = "landin_compiler"
path = "src/lib.rs"

# Unified test entry point — includes all tests/v0/stage{N}/plan/*.rs
# files via #[path] mod declarations. See tests/all_tests.rs.
[[test]]
name = "all_tests"
path = "tests/all_tests.rs"

# Stage 4.11: Performance benchmark suite
[[bench]]
name = "compile_bench"
path = "benches/compile_bench.rs"

[dependencies]
lasso = "0.7"
unicode-xid = "0.2"
clap = { version = "4", features = ["derive"] }
