[package]
name = "landin-compiler"
version = "0.9.1"
edition = "2021"
license = "MIT"
description = "Landin programming language compiler — Stage 0-3 complete + Stage 4.1-4.4 (nested modules + L1 PHI design decision + visibility enforcement + L3 closure lowering) + Process v3.16"
repository = "https://github.com/landin-lang/main"
authors = ["redskaber"]
keywords = ["compiler", "language", "systems-programming"]
categories = ["compilers"]

[[bin]]
name = "landin-stage0"
path = "src/bin/main.rs"

[lib]
name = "landin_compiler"
path = "src/lib.rs"

[dependencies]
lasso = "0.7"
unicode-xid = "0.2"
clap = { version = "4", features = ["derive"] }
